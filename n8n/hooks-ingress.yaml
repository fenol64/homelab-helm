apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n-hooks
  namespace: traefik
  annotations:
    tailscale.com/funnel: 'true'
  finalizers:
  - tailscale.com/finalizer
spec:
  defaultBackend:
    service:
      name: traefik
      port:
        number: 80
  ingressClassName: tailscale
  tls:
  - hosts:
    - n8n-hooks
