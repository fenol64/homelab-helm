# Nó Talos. Os arquivos ficam na partição files do Seagate (sdb3, 220Gi).
# O MariaDB fica no SSD, via local-path.
# Uso:
#   helm upgrade --install drive ./homelab-seafile -n drive --create-namespace -f values-homelab.yaml

namespace:
  create: true
  name: drive

timezone: America/Sao_Paulo

storage:
  storageClassName: local-path
  data:
    existingClaim: files-data
    size: 220Gi
  database:
    size: 8Gi

server:
  protocol: https
  publicHost: drive.taileba3bd.ts.net
  admin:
    email: admin@home.arpa
    password: changeme
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 768Mi
  ingress:
    host: drive.192.168.0.42.sslip.io
  tailscale:
    enabled: true
    hostname: drive

database:
  password: changemechangeme
  rootPassword: changemechangeme

redis:
  password: changemechangeme

auth:
  jwtPrivateKey: changemechangemechangemechangeme

ingress:
  enabled: true
  className: traefik
