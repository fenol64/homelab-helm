{{- $component := "redis" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homelab-seafile.fullname" . }}-{{ $component }}
  namespace: {{ include "homelab-seafile.namespace" . }}
  labels:
    {{- include "homelab-seafile.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "homelab-seafile.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelab-seafile.componentSelectorLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "homelab-seafile.secretName" . }}
                  key: redis-password
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "homelab-seafile.secretName" . }}
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab-seafile.redisHost" . }}
  namespace: {{ include "homelab-seafile.namespace" . }}
  labels:
    {{- include "homelab-seafile.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    {{- include "homelab-seafile.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
