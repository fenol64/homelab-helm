{{- $app := .Values.server }}
{{- if and $app.tailscale $app.tailscale.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "homelab-seafile.fullname" . }}-server-tailscale
  namespace: {{ include "homelab-seafile.namespace" . }}
  labels:
    {{- include "homelab-seafile.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: {{ include "homelab-seafile.fullname" . }}-server
      port:
        name: http
  tls:
    - hosts:
        - {{ $app.tailscale.hostname | quote }}
{{- end }}
