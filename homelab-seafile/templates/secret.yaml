{{- if lt (len .Values.auth.jwtPrivateKey) 32 }}
{{- fail "auth.jwtPrivateKey precisa ter pelo menos 32 caracteres" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homelab-seafile.secretName" . }}
  namespace: {{ include "homelab-seafile.namespace" . }}
  labels:
    {{- include "homelab-seafile.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.database.password | quote }}
  db-root-password: {{ .Values.database.rootPassword | quote }}
  admin-password: {{ .Values.server.admin.password | quote }}
  redis-password: {{ .Values.redis.password | quote }}
  jwt-private-key: {{ .Values.auth.jwtPrivateKey | quote }}
