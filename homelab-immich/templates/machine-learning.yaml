{{- if .Values.machineLearning.enabled }}
{{- $component := "machine-learning" }}
{{- $app := .Values.machineLearning }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homelab-immich.fullname" . }}-{{ $component }}
  namespace: {{ include "homelab-immich.namespace" . }}
  labels:
    {{- include "homelab-immich.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "homelab-immich.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelab-immich.componentSelectorLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      containers:
        - name: machine-learning
          image: "{{ $app.image.repository }}:{{ $app.image.tag }}"
          imagePullPolicy: {{ $app.image.pullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: MACHINE_LEARNING_MODEL_REVISION
              value: {{ $app.modelRevision | quote }}
            - name: MACHINE_LEARNING_WORKERS
              value: {{ $app.workers | quote }}
            - name: MACHINE_LEARNING_REQUEST_THREADS
              value: {{ $app.requestThreads | quote }}
            - name: MACHINE_LEARNING_MODEL_TTL
              value: {{ $app.modelTtl | quote }}
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: /cache
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          volumeMounts:
            - name: cache
              mountPath: /cache
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "homelab-immich.modelCachePvcName" . }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab-immich.machineLearningHost" . }}
  namespace: {{ include "homelab-immich.namespace" . }}
  labels:
    {{- include "homelab-immich.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3003
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "homelab-immich.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
{{- end }}
