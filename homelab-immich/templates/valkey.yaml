{{- $component := "valkey" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "homelab-immich.fullname" . }}-{{ $component }}
  namespace: {{ include "homelab-immich.namespace" . }}
  labels:
    {{- include "homelab-immich.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "homelab-immich.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "homelab-immich.componentSelectorLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "homelab-immich.valkeyHost" . }}
  namespace: {{ include "homelab-immich.namespace" . }}
  labels:
    {{- include "homelab-immich.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      protocol: TCP
      name: valkey
  selector:
    {{- include "homelab-immich.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
