{{- if not (regexMatch "^[A-Za-z0-9]+$" .Values.database.password) }}
{{- fail "database.password só pode conter letras e números (exigência do Immich)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "homelab-immich.secretName" . }}
  namespace: {{ include "homelab-immich.namespace" . }}
  labels:
    {{- include "homelab-immich.labels" . | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ .Values.database.password | quote }}
