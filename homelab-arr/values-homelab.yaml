# Values for the fenol-homelab Talos node (~12 GiB RAM, ~205 GiB livres em /opt).
# Usage:
#   helm upgrade --install media ./homelab-arr -n media --create-namespace -f values-homelab.yaml

namespace:
  create: true
  name: media

timezone: America/Sao_Paulo

storage:
  # Configs ficam no SSD. Biblioteca e downloads usam o PV movies-400g
  # (/var/mnt/movies no Seagate). local-path não impõe cota.
  storageClassName: local-path
  media:
    enabled: true
    size: 120Gi
    existingClaim: movies-400g
  downloads:
    enabled: true
    size: 40Gi
    existingClaim: movies-400g
    subPath: downloads

# Traefik (IngressClass traefik) publicado na porta 80 do nó.
# sslip.io resolve <nome>.192.168.0.42.sslip.io para 192.168.0.42, sem DNS local.
ingress:
  enabled: true
  className: traefik

jellyfin:
  enabled: true
  hardwareAcceleration: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1536Mi
  ingress:
    host: jellyfin.192.168.0.42.sslip.io
  tailscale:
    enabled: true
    hostname: jellyfin

jellyseerr:
  enabled: true
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 384Mi
  ingress:
    host: seerr.192.168.0.42.sslip.io
  tailscale:
    enabled: true
    hostname: seerr

radarr:
  enabled: true
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
  ingress:
    host: radarr.192.168.0.42.sslip.io

sonarr:
  enabled: true
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 512Mi
  ingress:
    host: sonarr.192.168.0.42.sslip.io

prowlarr:
  enabled: true
  resources:
    requests:
      memory: 128Mi
    limits:
      memory: 384Mi
  ingress:
    host: prowlarr.192.168.0.42.sslip.io

qbittorrent:
  enabled: true
  resources:
    requests:
      memory: 256Mi
    limits:
      memory: 768Mi
  service:
    bittorrentServiceType: NodePort
  ingress:
    host: qbit.192.168.0.42.sslip.io
