apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: disk
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: default
  source:
    repoURL: https://github.com/fenol64/homelab-helm.git
    targetRevision: main
    path: homelab-disk
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
