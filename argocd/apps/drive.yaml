apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: drive
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: default
  source:
    repoURL: https://github.com/fenol64/homelab-helm.git
    targetRevision: main
    path: homelab-seafile
    helm:
      releaseName: drive
      valueFiles:
        - values-homelab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: drive
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
