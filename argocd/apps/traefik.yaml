apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.7.1
    helm:
      releaseName: traefik
      values: |
        gateway:
          enabled: false
        ingressClass:
          enabled: true
          isDefaultClass: false
        ports:
          web:
            hostPort: 80
          websecure:
            expose:
              default: false
        service:
          spec:
            type: ClusterIP
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
