apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: default
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.104.1
    helm:
      releaseName: tailscale-operator
      values: |
        oauth:
          clientId: ""
          clientSecret: ""
        operatorConfig:
          defaultTags:
            - tag:k8s-operator
          podSecurityContext:
            seccompProfile:
              type: RuntimeDefault
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        proxyConfig:
          defaultTags: tag:k8s
          image:
            repository: ghcr.io/tailscale/tailscale
            tag: v1.104.1
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
