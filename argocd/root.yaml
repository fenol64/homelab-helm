# App of apps. Aplica argocd/apps quando este arquivo está em main.
# O bootstrap inicial é kubectl apply -f argocd/apps e -f argocd/root.yaml
# depois do push, porque o Argo CD lê o GitHub e não o diretório local.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: default
  source:
    repoURL: https://github.com/fenol64/homelab-helm.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
